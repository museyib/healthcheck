services:
  health-service:
    build: .
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DB_URL: jdbc:postgresql://db:5432/healthcheck
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_USERNAME: ${APP_USERNAME:-monitor}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD must be set}
    depends_on:
      - db

  db:
    image: postgres:15.4-alpine
    environment:
      POSTGRES_DB: healthcheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]

