spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: healthcheck
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthcheck}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

  endpoints:
    web:
      exposure:
        include:
          - metrics
          - actuator
          - health

monitoring:
  scheduler:
    poll-interval: 1000
  dependency:
    url: ${MONITORING_DEPENDENCY_URL:https://httpbin.org/status/200}
  http:
    connect-timeout: 5000
    read-timeout: 5000

server:
  port: 8090

app:
  username: ${APP_USERNAME:monitor}
  password: ${APP_PASSWORD}
  role: ${APP_ROLE:MONITOR}