spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: healthcheck
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthcheck}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  endpoints:
    web:
      exposure:
        include:
          - metrics
          - actuator
          - health

monitoring:
  scheduler:
    poll-interval: 1000

server:
  port: 8090