spring:
  datasource:
    url: jdbc:h2:mem:healthcheck;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

management:
  endpoints:
    web:
      exposure:
        include: metrics,health
  endpoint:
    health:
      show-details: always

monitoring:
  scheduler:
    poll-interval: 1000
  dependency:
    url: http://127.0.0.1:1/unused
  http:
    connect-timeout: 5
    read-timeout: 5

app:
  username: integration
  password: integration-password
  role: MONITOR
